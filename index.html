<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop Recall — Amazon Interview Story Engine</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --bg3: #1a1a26;
  --bg4: #22222e;
  --text: #e8e8f0;

/* Auth Screen */
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  font-family: var(--font);
}
.auth-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.auth-logo {
  font-size: 28px;
  font-weight: 900;
  text-align: center;
  color: var(--text);
}
.auth-logo span { color: var(--accent); font-size: 14px; font-weight: 600; }
.auth-subtitle {
  font-size: 14px;
  color: var(--text2);
  text-align: center;
  margin-top: -12px;
}
.auth-input {
  width: 100%;
  padding: 12px 14px;
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  box-sizing: border-box;
}
.auth-input:focus { border-color: var(--accent); outline: none; }
.auth-btn {
  width: 100%;
  padding: 13px;
  font-family: var(--font);
  font-size: 15px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.15s;
}
.auth-btn-primary { background: var(--accent); color: #fff; }
.auth-btn-primary:hover { background: var(--accent2); }
.auth-btn-secondary { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.auth-btn-secondary:hover { background: var(--bg4); color: var(--text); }
.auth-toggle {
  font-size: 13px;
  color: var(--text3);
  text-align: center;
}
.auth-toggle a {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
  font-weight: 600;
}
.auth-toggle a:hover { text-decoration: underline; }
.auth-error {
  font-size: 13px;
  color: var(--red);
  text-align: center;
  padding: 8px;
  background: rgba(239,68,68,0.1);
  border-radius: 8px;
  display: none;
}
.auth-loading {
  text-align: center;
  color: var(--text2);
  font-size: 14px;
  padding: 40px;
}
  --text2: #9898aa;
  --text3: #6868778;
  --accent: #ff6b35;
  --accent2: #ff8c5a;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #eab308;
  --blue: #3b82f6;
  --border: #2a2a3a;
  --card: #16161f;
  --card-hover: #1e1e2a;
  --used-bg: rgba(239,68,68,0.08);
  --used-border: rgba(239,68,68,0.3);
  --font: 'Outfit', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --radius: 10px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
.theme-light {
  --bg: #f5f5f0;
  --bg2: #eaeae5;
  --bg3: #e0e0db;
  --bg4: #d5d5d0;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #888;
  --border: #ccc;
  --card: #ffffff;
  --card-hover: #fafaf5;
  --used-bg: rgba(239,68,68,0.06);
  --used-border: rgba(239,68,68,0.25);
  --shadow: 0 4px 24px rgba(0,0,0,0.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* LP Colors */
.lp-customer-obsession { --lpc: #ff6b35; }
.lp-ownership { --lpc: #22c55e; }
.lp-invent-and-simplify { --lpc: #a855f7; }
.lp-are-right-a-lot { --lpc: #3b82f6; }
.lp-learn-and-be-curious { --lpc: #eab308; }
.lp-hire-and-develop-the-best { --lpc: #14b8a6; }
.lp-insist-on-the-highest-standards { --lpc: #f43f5e; }
.lp-think-big { --lpc: #8b5cf6; }
.lp-bias-for-action { --lpc: #f97316; }
.lp-earn-trust { --lpc: #06b6d4; }
.lp-dive-deep { --lpc: #0ea5e9; }
.lp-have-backbone-disagree-and-commit { --lpc: #dc2626; }
.lp-deliver-results { --lpc: #16a34a; }

/* Layout */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 6px;
  overflow-y: auto;
}
.sidebar-logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--accent);
  padding: 8px 4px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sidebar-logo span { font-size: 14px; color: var(--text2); font-weight: 400; }
.sidebar-section {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text3);
  padding: 12px 4px 4px;
}
.interviewer-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left;
  width: 100%;
}
.interviewer-btn:hover { background: var(--bg3); }
.interviewer-btn.active {
  background: var(--bg4);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 700;
}
.interviewer-btn .used-count {
  margin-left: auto;
  background: var(--bg4);
  color: var(--text2);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 99px;
  font-family: var(--mono);
}
.interviewer-btn.active .used-count { background: rgba(255,107,53,0.15); color: var(--accent); }

.sidebar-actions {
  margin-top: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.sidebar-action-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border: none; border-radius: var(--radius);
  background: transparent;
  color: var(--text2);
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.15s;
  text-align: left; width: 100%;
}
.sidebar-action-btn:hover { background: var(--bg3); color: var(--text); }

/* Main content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  padding: 16px 24px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  position: relative;
  z-index: 10;
}
.search-row { display: flex; gap: 10px; align-items: center; }
.search-input {
  flex: 1;
  padding: 14px 18px;
  font-size: 18px;
  font-family: var(--font);
  font-weight: 500;
  background: var(--bg2);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--text3); }
.search-hint {
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
  padding: 4px 10px;
  background: var(--bg3);
  border-radius: 4px;
  white-space: nowrap;
}

.lp-chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 2px 0;
}
.lp-chip {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 99px;
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: var(--font);
}
.lp-chip:hover { background: var(--bg3); color: var(--text); }
.lp-chip.active {
  background: var(--lpc, var(--accent));
  color: #fff;
  border-color: var(--lpc, var(--accent));
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
}

/* Pinned */
.pinned-row {
  display: flex;
  gap: 8px;
  padding: 8px 24px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  align-items: center;
  overflow-x: auto;
}
.pinned-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text3);
  margin-right: 4px;
  white-space: nowrap;
}
.pinned-story {
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
  border: 1px solid;
  transition: all 0.15s;
}
.pinned-story:hover { transform: scale(1.05); }

/* Story grid */
.story-grid-container {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}
.story-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px;
}
.story-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
}
.story-card:hover {
  background: var(--card-hover);
  border-color: var(--text3);
  transform: translateY(-1px);
  box-shadow: var(--shadow);
}
.story-card.active-nav {
  border-color: var(--accent);
  box-shadow: 0 0 0 2px rgba(255,107,53,0.3);
}
.story-card.is-used {
  background: var(--used-bg);
  border-color: var(--used-border);
}
.story-card.used-elsewhere {
  border-color: var(--used-border);
  background: var(--used-bg);
}
.story-card.used-elsewhere:hover {
  border-color: var(--red);
}
.used-elsewhere-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 4px 12px;
  font-size: 10px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: #fff;
  border: none;
  border-radius: 6px;
  background: #e67e22;
  box-shadow: 0 2px 6px rgba(230,126,34,0.35);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.story-card-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.2;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.story-card-title .pin-icon {
  color: var(--yellow);
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 2px;
}
.story-card-lp {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  width: fit-content;
}
.story-card-secondary-lps {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.secondary-lp-badge {
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 9px;
  font-weight: 600;
  background: var(--bg3);
  color: var(--text2);
}
.story-card-keywords {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.keyword-chip {
  padding: 2px 8px;
  font-size: 10px;
  font-family: var(--mono);
  font-weight: 600;
  background: var(--bg3);
  color: var(--text2);
  border-radius: 4px;
}
.used-badge {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 4px 12px;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #fff;
  border: none;
  border-radius: 6px;
  background: var(--red);
  box-shadow: 0 2px 6px rgba(239,68,68,0.35);
}
.story-card-company {
  font-size: 11px;
  color: var(--text3);
  font-weight: 500;
}

/* Filter buttons */
.filter-row {
  display: flex;
  gap: 6px;
  align-items: center;
  padding: 0 2px;
}
.filter-btn {
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
  display: flex;
  align-items: center;
  gap: 6px;
}
.filter-btn:hover { background: var(--bg3); color: var(--text); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.filter-btn.active-green { background: var(--green); color: #fff; border-color: var(--green); }
.filter-btn.active-red { background: var(--red); color: #fff; border-color: var(--red); }
.filter-count {
  font-size: 11px;
  font-family: var(--mono);
  font-weight: 700;
  background: rgba(255,255,255,0.2);
  padding: 1px 6px;
  border-radius: 99px;
}

/* AI Story Import */
.ai-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 260;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s;
}
.ai-panel {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 720px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.ai-panel textarea {
  width: 100%;
  min-height: 250px;
  padding: 14px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.6;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  resize: vertical;
  box-sizing: border-box;
}
.ai-panel textarea:focus { border-color: var(--accent); outline: none; }
.ai-status {
  font-size: 13px;
  color: var(--text2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ai-spinner {
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Story Editor */
.se-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s;
}
.se-panel {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 860px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 28px 32px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.se-title { font-size: 22px; font-weight: 800; margin: 0; display: flex; align-items: center; justify-content: space-between; }
.se-row { display: flex; gap: 12px; }
.se-row > * { flex: 1; }
.se-label {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text2);
  margin-bottom: 4px;
}
.se-input {
  width: 100%;
  padding: 10px 12px;
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  box-sizing: border-box;
}
.se-input:focus { border-color: var(--accent); outline: none; }
.se-textarea {
  width: 100%;
  min-height: 90px;
  padding: 10px 12px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  resize: vertical;
  box-sizing: border-box;
}
.se-textarea:focus { border-color: var(--accent); outline: none; }
.se-select {
  width: 100%;
  padding: 10px 12px;
  font-family: var(--font);
  font-size: 14px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  cursor: pointer;
  box-sizing: border-box;
}
.se-lp-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.se-lp-chip {
  padding: 4px 12px;
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg2);
  color: var(--text2);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
}
.se-lp-chip:hover { background: var(--bg3); color: var(--text); }
.se-lp-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.se-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 8px; border-top: 1px solid var(--border); }
.se-starr-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 6px;
}
.se-starr-label .letter {
  display: inline-flex;
  width: 22px;
  height: 22px;
  align-items: center;
  justify-content: center;
  border-radius: 5px;
  color: #fff;
  font-size: 12px;
  font-weight: 800;
}

/* Cheat Sheet Detail */
.swot-item {
  display: flex;
  gap: 10px;
  padding: 10px 14px;
  border-radius: 8px;
  background: var(--bg2);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
  align-items: flex-start;
}
.swot-item strong { color: var(--text); }
.swot-item.s { border-left: 3px solid #22c55e; }
.swot-item.w { border-left: 3px solid #f97316; }
.swot-item.o { border-left: 3px solid #3b82f6; }
.swot-item.t { border-left: 3px solid #ef4444; }
.swot-item.gtm { border-left: 3px solid #8b5cf6; }
.swot-num {
  min-width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 800;
  color: #fff;
  background: var(--bg3);
  flex-shrink: 0;
}
.swot-item.s .swot-num { background: #22c55e; }
.swot-item.w .swot-num { background: #f97316; }
.swot-item.o .swot-num { background: #3b82f6; }
.swot-item.t .swot-num { background: #ef4444; }
.swot-item.gtm .swot-num { background: #8b5cf6; }
.cs-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.15s;
}
.cs-panel {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 860px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 0;
}
.cs-header {
  padding: 28px 32px 20px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--bg);
  border-radius: 16px 16px 0 0;
  z-index: 2;
}
.cs-name { font-size: 26px; font-weight: 800; margin: 0; }
.cs-title { font-size: 14px; color: var(--text2); margin: 2px 0 0; }
.cs-meta { font-size: 12px; color: var(--text3); margin: 6px 0 0; }
.cs-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.cs-tag {
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;

async function loadFromSupabase() {
  if (!currentUser) return false;
  try {
    const { data, error } = await supa
      .from('user_settings')
      .select('app_data')
      .eq('user_id', currentUser.id)
      .single();

    if (error && error.code === 'PGRST116') {
      // No settings row yet — create one with current localStorage data
      const localSaved = localStorage.getItem(STORAGE_KEY);
      const appData = localSaved ? JSON.parse(localSaved) : {};
      await supa.from('user_settings').insert({
        user_id: currentUser.id,
        app_data: appData,
      });
      return !!localSaved;
    }

    if (error) throw error;

    if (data && data.app_data && Object.keys(data.app_data).length > 0) {
      const d = data.app_data;
      if (d.stories) state.stories = d.stories;
      if (d.interviewers && d.interviewers.length) state.interviewers = d.interviewers;
      if (d.usages) state.usages = d.usages;
      if (d.pinnedStoryIds) state.pinnedStoryIds = d.pinnedStoryIds;
      if (d.roleDescription) state.roleDescription = d.roleDescription;
      if (d.resumeText) state.resumeText = d.resumeText;
      if (d.theme) state.theme = d.theme;
      // Also save to localStorage as cache
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
      return true;
    }
    return false;
  } catch(e) {
    console.warn('Supabase load failed, falling back to localStorage', e);
    return false;
  }
}

function syncToSupabase() {
  if (!currentUser) return;
  clearTimeout(syncTimeout);
  syncTimeout = setTimeout(async () => {
    try {
      const appData = {
        stories: state.stories,
        interviewers: state.interviewers,
        usages: state.usages,
        pinnedStoryIds: state.pinnedStoryIds,
        roleDescription: state.roleDescription,
        resumeText: state.resumeText,
        theme: state.theme,
      };
      await supa
        .from('user_settings')
        .upsert({
          user_id: currentUser.id,
          app_data: appData,
          updated_at: new Date().toISOString(),
        }, { onConflict: 'user_id' });
    } catch(e) {
      console.warn('Supabase sync failed', e);
    }
  }, 1500); // Debounce 1.5s
}

  if (appInitialized) return;

// SEARCH & RANKING
// ============================================================
function searchStories(query, lpFilter) {
  let results = [...state.stories];
  const q = (query || '').trim().toLowerCase();
  const resolvedLP = q ? resolveLPInput(q) : null;

  if (lpFilter) {
    if (state.lpFilterMode === 'primary') {
      results = results.filter(s => s.primaryLP === lpFilter);
    } else if (state.lpFilterMode === 'secondary') {
      results = results.filter(s => s.secondaryLPs && s.secondaryLPs.includes(lpFilter));
    } else {
      results = results.filter(s => s.primaryLP === lpFilter || (s.secondaryLPs && s.secondaryLPs.includes(lpFilter)));
    }
  }

  // Apply used/unused filter (for currently selected interviewer)
  if (state.storyFilter === 'used') {
    const currentUsedIds = getUsedStoryIds(state.selectedInterviewerId);
    results = results.filter(s => currentUsedIds.has(s.id));
  } else if (state.storyFilter === 'unused') {
    const currentUsedIds = getUsedStoryIds(state.selectedInterviewerId);
    results = results.filter(s => !currentUsedIds.has(s.id));
  }

  if (!q) {
    // Sort used stories to top
    const allUsedIds = getAllUsedStoryIds();
    results.sort((a, b) => {
      const aUsed = allUsedIds.has(a.id) ? 1 : 0;
      const bUsed = allUsedIds.has(b.id) ? 1 : 0;
      if (aUsed !== bUsed) return bUsed - aUsed;
      return (a.title || '').localeCompare(b.title || '');
    });
    return results;
  }

  const allUsedIds = getAllUsedStoryIds();
  const hasMetricQuery = ['metric','metrics','number','numbers','deliver','data','kpi','percent','revenue'].some(w => q.includes(w));

  // Extract exact phrases in quotes and remaining loose words
  const exactPhrases = [];
  const qWithoutPhrases = q.replace(/"([^"]+)"/g, (_, phrase) => { exactPhrases.push(phrase.trim()); return ''; }).trim();
  const looseWords = qWithoutPhrases.split(/\s+/).filter(w => w.length > 1);

  const scored = results.map(s => {
    let score = 0;
    const titleLower = (s.title || '').toLowerCase();
    const keywordsLower = (s.keywords || []).map(k => k.toLowerCase());
    const companyLower = (s.company || '').toLowerCase();
    const allText = [s.situation, s.task, s.action, s.result, s.relevance, s.fullStory].map(t => (t||'').toLowerCase()).join(' ');
    const searchable = titleLower + ' ' + keywordsLower.join(' ') + ' ' + companyLower + ' ' + allText;

    // Exact phrase matching — ALL phrases must match or story is excluded
    if (exactPhrases.length > 0) {
      const allPhrasesMatch = exactPhrases.every(p => searchable.includes(p));
      if (!allPhrasesMatch) return { story: s, score: 0 };
      score += exactPhrases.length * 100;
    }

    // Title exact
    if (q && titleLower.includes(q)) score += 100;
    // Keyword exact
    if (q && keywordsLower.some(k => k.includes(q) || q.includes(k))) score += 90;
    // Company
    if (q && companyLower.includes(q)) score += 70;
    // LP match
    if (resolvedLP) {
      if (s.primaryLP === resolvedLP) score += 80;
      if (s.secondaryLPs && s.secondaryLPs.includes(resolvedLP)) score += 50;
    }
    // Loose words: check each word
    looseWords.forEach(w => {
      if (titleLower.includes(w)) score += 30;
      if (keywordsLower.some(k => k.includes(w))) score += 25;
      if (companyLower.includes(w)) score += 15;
      if (allText.includes(w)) score += 5;
    });
    // STAR fields
    if (q && allText.includes(q)) score += 10;
    // Metric boost
    if (hasMetricQuery && /\d/.test(s.result || '')) score += 20;
    // Used boost — only if already matched on text
    if (score > 0 && allUsedIds.has(s.id)) score += 8;

    return { story: s, score };
  });

  scored.sort((a, b) => b.score - a.score);
  return scored.filter(s => s.score > 0).map(s => s.story);
}

// ============================================================
// HIGHLIGHT NUMBERS IN TEXT
// ============================================================
function highlightNumbers(text) {
  if (!text) return '';
  return escapeHtml(text).replace(/(\$?\d[\d,]*\.?\d*%?)/g, '<span class="num-highlight">$1</span>');
}

function formatFullStory(text) {
  if (!text) return '';
  let html = escapeHtml(text);

  // Normalize line breaks
  html = html.replace(/\r\n/g, '\n');

  // Split into paragraphs (double newline or more)
  let paragraphs = html.split(/\n{2,}/);

  paragraphs = paragraphs.map(p => {
    p = p.trim();
    if (!p) return '';

    // Check if this block is a list (lines starting with - or * or •  or numbered)
    const lines = p.split('\n');
    const isList = lines.every(l => /^\s*[-*•]\s|^\s*\d+[.)]\s/.test(l) || l.trim() === '');

    if (isList) {
      const items = lines.filter(l => l.trim()).map(l => {
        let item = l.replace(/^\s*[-*•]\s*/, '').replace(/^\s*\d+[.)]\s*/, '').trim();
        item = highlightNumbers(item);
        item = boldKeyPhrases(item);
        return '<li>' + item + '</li>';
      });
      return '<ul class="fs-list">' + items.join('') + '</ul>';
    }

    // Check if line looks like a heading (short, no period at end, possibly all caps or title case)
    if (p.length < 80 && !p.endsWith('.') && !p.endsWith(',') && (p === p.toUpperCase() || /^[A-Z][^.]*$/.test(p))) {
      return '<div class="fs-heading">' + p + '</div>';
    }

    // Regular paragraph — join single newlines into flowing text
    let joined = lines.map(l => l.trim()).join(' ');
    joined = highlightNumbers(joined);
    joined = boldKeyPhrases(joined);

    return '<p class="fs-paragraph">' + joined + '</p>';
  });

  return paragraphs.filter(p => p).join('');
}

function boldKeyPhrases(html) {
  // Bold key result phrases: percentages, dollar amounts, big numbers with context
  html = html.replace(/(<span class="num-highlight">[^<]+<\/span>)/g, '<strong>$1</strong>');
  // Bold common impact words near numbers
  html = html.replace(/\b(increased|decreased|reduced|improved|grew|saved|generated|achieved|delivered|exceeded|drove|boosted|cut|launched|scaled|doubled|tripled|quadrupled)\b/gi, '<em class="fs-action-word">$1</em>');
  return html;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function escapeAttr(text) {
  return String(text).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// RELEVANCE HIGHLIGHTING
// ============================================================
function getRelevanceKeywords() {
  const words = new Set();
  [state.roleDescription, state.resumeText].forEach(text => {
    if (!text) return;
    text.toLowerCase().split(/\W+/).filter(w => w.length > 3).forEach(w => words.add(w));
  });
  // Remove very common words
  ['that','this','with','from','have','will','been','they','their','your','about','which','when','were','what','would','could','should','into','some','other','than','then','them','also','more','most','very','each','just','because','does','like','make','being'].forEach(w => words.delete(w));
  return words;
}

function highlightRelevance(text) {
  if (!text) return '';
  const keywords = getRelevanceKeywords();
  if (keywords.size === 0) return escapeHtml(text);
  let html = escapeHtml(text);
  keywords.forEach(kw => {
    const re = new RegExp(`\\b(${kw})\\b`, 'gi');
    html = html.replace(re, '<span class="relevance-highlight">$1</span>');
  });
  return html;
}

// ============================================================
// CSV IMPORT
// ============================================================
function importStoriesCSV(file, callback) {
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const imported = [];
      const errors = [];
      const warnings = [];

      results.data.forEach((row, i) => {
        const lineNum = i + 2;
        const title = (row.title || '').trim();
        if (!title) { errors.push(`Row ${lineNum}: missing title`); return; }

        const primaryLP = resolveLPInput(row.primaryLP);
        if (!primaryLP) { errors.push(`Row ${lineNum}: invalid primaryLP "${row.primaryLP}"`); return; }

        const secondaryLPs = (row.secondaryLPs || '').split('|').map(s => s.trim()).filter(Boolean).map(s => {
          const resolved = resolveLPInput(s);
          if (!resolved) warnings.push(`Row ${lineNum}: invalid secondaryLP "${s}" (ignored)`);
          return resolved;
        }).filter(Boolean);

        const keywords = (row.keywords || '').split('|').map(s => s.trim()).filter(Boolean);

        // Auto-generate keywords from title/company if none provided
        if (keywords.length === 0) {
          const autoKw = (title + ' ' + (row.company || '')).split(/\s+/).filter(w => w.length > 3);
          keywords.push(...autoKw.slice(0, 4));
        }

        imported.push({
          id: (row.id || '').trim() || uuid(),
          title,
          company: (row.company || '').trim(),
          primaryLP,
          secondaryLPs,
          keywords,
          situation: (row.situation || '').trim(),
          task: (row.task || '').trim(),
          action: (row.action || '').trim(),
          result: (row.result || '').trim(),
          relevance: (row.relevance || '').trim(),
          fullStory: (row.fullStory || '').trim(),
          createdAt: Date.now(),
          updatedAt: Date.now(),
        });
      });

      // Merge: update existing by id, add new
      imported.forEach(s => {
        const existIdx = state.stories.findIndex(e => e.id === s.id);
        if (existIdx >= 0) {
          state.stories[existIdx] = { ...state.stories[existIdx], ...s, updatedAt: Date.now() };
        } else {
          state.stories.push(s);
        }
      });

      saveState();
      callback({ imported: imported.length, errors, warnings });
    },
    error: function(err) {
      callback({ imported: 0, errors: [err.message], warnings: [] });
    }
  });
}

function importInterviewersCSV(file, callback) {
  Papa.parse(file, {
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      const imported = [];
      results.data.forEach((row, i) => {
        const name = (row.name || '').trim();
        if (!name) return;
        const focusLPs = (row.focusLPs || '').split('|').map(s => resolveLPInput(s.trim())).filter(Boolean);
        imported.push({
          id: (row.id || '').trim() || uuid(),
          name,
          role: (row.role || '').trim(),
          focusLPs,
          notes: (row.notes || '').trim(),
        });
      });
      if (imported.length > 0) {
        state.interviewers = imported;
        state.selectedInterviewerId = imported[0].id;
      }
      saveState();
      callback({ imported: imported.length });
    }
  });
}

function exportStoriesCSV() {
  const rows = state.stories.map(s => ({
    id: s.id,
    title: s.title,
    company: s.company,
    primaryLP: s.primaryLP,
    secondaryLPs: (s.secondaryLPs || []).join('|'),
    keywords: (s.keywords || []).join('|'),
    situation: s.situation,
    task: s.task,
    action: s.action,
    result: s.result,
    relevance: s.relevance,
    fullStory: s.fullStory || '',
  }));
  const csv = Papa.unparse(rows);
  downloadCSV(csv, 'stories-export.csv');
}

function exportUsageCSV() {
  const rows = state.usages.map(u => {
    const story = state.stories.find(s => s.id === u.storyId);
    const interviewer = state.interviewers.find(i => i.id === u.interviewerId);
    return {
      storyTitle: story ? story.title : u.storyId,
      interviewer: interviewer ? interviewer.name : u.interviewerId,
      timestamp: new Date(u.timestamp).toISOString(),
      note: u.note || '',
    };
  });
  const csv = Papa.unparse(rows);
  downloadCSV(csv, 'usage-export.csv');
}

function downloadCSV(csvContent, filename) {
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

let toastTimer = null;
function showToast(message, type = 'success') {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = message;
  document.body.appendChild(toast);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.remove(), 2500);
}

            usedStories.add(s.id);
          }
        });
      });
      lpCoverage[lp.id] = { total, used: usedStories.size };
    });

    content = `
      <div class="modal" style="max-width:850px">
        <div class="modal-title">📊 Coverage Dashboard</div>

        <div>
          <div class="modal-section-title">Stories Used per Interviewer</div>
          <div class="coverage-grid">
            ${state.interviewers.map(int => `
              <div class="coverage-item">
                <div class="label">${escapeHtml(int.name)}</div>
                <div class="value" style="color:var(--accent)">${usedCount(int.id)}</div>
              </div>
            `).join('')}
            <div class="coverage-item">
              <div class="label">Total Stories</div>
              <div class="value">${state.stories.length}</div>
            </div>
          </div>
        </div>

        <div>
          <div class="modal-section-title">LP Coverage (Used / Available)</div>
          <div class="coverage-grid">
            ${LEADERSHIP_PRINCIPLES.map(lp => {
              const c = lpCoverage[lp.id];
              return `
                <div class="coverage-item" style="border-left:3px solid ${lpColor(lp.id)}">
                  <div class="label">${lp.short} — ${lp.name}</div>
                  <div class="value">${c.used}<span style="font-size:14px;color:var(--text3)">/${c.total}</span></div>
                </div>
              `;
            }).join('')}
          </div>
        </div>

        <div class="modal-actions">
          <button class="btn" onclick="closeModal()">Close</button>
        </div>
      </div>
    `;
  }

  overlay.innerHTML = content;
  app.appendChild(overlay);

  // Attach file handlers
  if (state.activeModal === 'import') {
    setTimeout(() => {
      const storiesInput = document.getElementById('storiesFileInput');
      if (storiesInput) {
        storiesInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          importStoriesCSV(file, (result) => {
            const div = document.getElementById('storiesImportSummary');
            if (!div) return;
            let html = '<div class="import-summary">';
            html += `<div class="success-line">✓ Imported ${result.imported} stories</div>`;
            result.warnings.forEach(w => { html += `<div class="warn-line">⚠ ${escapeHtml(w)}</div>`; });
            result.errors.forEach(e => { html += `<div class="error-line">✗ ${escapeHtml(e)}</div>`; });
            html += '</div>';
            div.innerHTML = html;
            render();
            showToast(`Imported ${result.imported} stories`);
          });
        };
      }
      const intInput = document.getElementById('interviewersFileInput');
      if (intInput) {
        intInput.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          importInterviewersCSV(file, (result) => {
            const div = document.getElementById('interviewersImportSummary');
            if (!div) return;
            div.innerHTML = `<div class="import-summary"><div class="success-line">✓ Imported ${result.imported} interviewers</div></div>`;
            render();
            showToast(`Imported ${result.imported} interviewers`);
          });
        };
      }
    }, 100);
  }
}

        <div style="font-size:22px;font-weight:800">🤖 AI Story Formatter</div>

      </div>
      <div style="font-size:13px;color:var(--text2);line-height:1.5">
        Paste any unstructured text — notes, bullet points, a brain dump, an email, a doc excerpt — and Claude will format it into a structured STARR story with LP classification, keywords, and all fields populated.
      </div>
      <div>
        <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text2);margin-bottom:4px">Claude API Key</div>
        <input class="se-input" id="ai-api-key" type="password" value="${escapeAttr(savedKey)}" placeholder="sk-ant-..." style="font-family:var(--mono);font-size:12px" />
        <div style="font-size:11px;color:var(--text3);margin-top:4px">Get yours at <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--accent)">console.anthropic.com</a> — stored locally only</div>
      </div>
      <textarea id="ai-raw-input" placeholder="Paste your raw story text here...&#10;&#10;Example: So there was this deal at Sprout with McKesson where we were about to lose a million dollar account to Sprinklr. I pulled together a SWAT team and we went onsite with the new SVP..."></textarea>
      <div id="ai-status-area"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" onclick="closeAIImport()">Cancel</button>
        <button class="btn btn-primary" id="ai-format-btn" onclick="runAIFormat()">🤖 Format with Claude</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  const escHandler = (e) => {
    if (e.key === 'Escape') { closeAIImport(); document.removeEventListener('keydown', escHandler); }
  };
  document.addEventListener('keydown', escHandler);

function closeAIImport() {
  const el = document.getElementById('ai-import-overlay');
  if (el) el.remove();
}

async function runAIFormat() {
  const input = document.getElementById('ai-raw-input');
  const statusArea = document.getElementById('ai-status-area');
  const btn = document.getElementById('ai-format-btn');
  if (!input || !input.value.trim()) { showToast('Paste some text first'); return; }

  const rawText = input.value.trim();
  btn.disabled = true;
  btn.textContent = '⏳ Formatting...';
  statusArea.innerHTML = '<div class="ai-status"><div class="ai-spinner"></div> Claude is analyzing and structuring your story...</div>';

  const lpList = LEADERSHIP_PRINCIPLES.map(lp => `${lp.id} (${lp.name})`).join(', ');

  const systemPrompt = `You are an expert at structuring behavioral interview stories for Amazon Leadership Principles interviews. You will receive unstructured text — notes, bullet points, brain dumps, or partial narratives — and must format them into a structured STARR story.

Return ONLY a valid JSON object with these exact keys (no markdown, no backticks, no explanation):
{
  "title": "Short descriptive title for the story",
  "company": "Company name (e.g. Sprout Social, Salesforce)",
  "primaryLP": "one LP id from the list below",
  "secondaryLPs": ["array of 2-4 secondary LP ids"],
  "keywords": ["array of 6-12 keywords/phrases"],
  "situation": "The context and setup (2-4 sentences)",
  "task": "Your specific responsibility (2-3 sentences)",
  "action": "What you actually did — specific, detailed (4-8 sentences)",
  "result": "Measurable outcomes (2-4 sentences)",
  "relevance": "Why this matters for an AWS leadership role (2-3 sentences)",
  "fullStory": "The complete narrative version combining all sections into flowing prose"
}

Available LP ids: ${lpList}

Rules:
- primaryLP must be the single LP that best matches the DEFINING MOMENT of the story
- If this is clearly a failure/lesson-learned story, use "failure" as primaryLP
- Keywords should include: company names, dollar amounts, metrics, key themes, techniques used
- Be specific with numbers and outcomes — preserve any metrics from the source text
- The fullStory should read naturally as a 2-3 minute interview response
- If information is missing, make reasonable inferences but don't fabricate metrics`;

  const apiKeyInput = document.getElementById('ai-api-key');
  const apiKey = apiKeyInput ? apiKeyInput.value.trim() : '';
  if (!apiKey) { showToast('Enter your Claude API key'); return; }

  // Save key for next time
  localStorage.setItem('loop-recall-api-key', apiKey);

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 4000,
        messages: [
          { role: 'user', content: `Format this into a structured STARR interview story:\n\n${rawText}` }
        ],
        system: systemPrompt,
      })
    });

    const data = await response.json();

    if (!response.ok) {
      if (response.status === 401) throw new Error('Invalid API key — check your key at console.anthropic.com');
      if (response.status === 429) throw new Error('Rate limited — wait a moment and try again');
      throw new Error(data.error?.message || `API error (${response.status})`);
    }

    const text = data.content.map(item => item.text || '').join('');
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    // Validate required fields
    if (!parsed.title || !parsed.primaryLP) {
      throw new Error('Missing required fields in response');
    }

    // Resolve LPs
    const resolvedPrimary = resolveLPInput(parsed.primaryLP) || parsed.primaryLP;
    const resolvedSecondaries = (parsed.secondaryLPs || []).map(lp => resolveLPInput(lp) || lp).filter(Boolean);

    // Close AI import and open story editor with populated data
    closeAIImport();

    state.editingStory = {
      id: uuid(),
      title: parsed.title || '',
      company: parsed.company || 'Sprout Social',
      primaryLP: resolvedPrimary,
      secondaryLPs: resolvedSecondaries,
      keywords: parsed.keywords || [],
      situation: parsed.situation || '',
      task: parsed.task || '',
      action: parsed.action || '',
      result: parsed.result || '',
      relevance: parsed.relevance || '',
      fullStory: parsed.fullStory || '',
      _isNew: true,
    };

    renderStoryEditor();
    showToast('Story formatted — review and save');

  } catch (err) {
    console.error('AI Format error:', err);
    statusArea.innerHTML = `<div class="ai-status" style="color:var(--red)">❌ Error: ${escapeHtml(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = '🤖 Format with Claude';
  }
}

function newStory() {
  state.editingStory = {
    id: uuid(),
    title: '',
    company: 'Sprout Social',
    primaryLP: 'customer-obsession',
    secondaryLPs: [],
    keywords: [],
    situation: '',
    task: '',
    action: '',
    result: '',
    relevance: '',
    fullStory: '',
    _isNew: true,
  };
  renderStoryEditor();
}

function editStory(id) {
  const s = state.stories.find(s => s.id === id);
  if (!s) return;
  state.openStoryId = null;
  state.showFullStory = false;
  state.editingStory = JSON.parse(JSON.stringify(s));
  state.editingStory._isNew = false;
  render();
  renderStoryEditor();
}

function deleteStory(id) {
  const s = state.stories.find(s => s.id === id);
  if (!s) return;
  if (!confirm(`Delete "${s.title}"? This cannot be undone.`)) return;
  state.stories = state.stories.filter(s => s.id !== id);
  state.pinnedStoryIds = state.pinnedStoryIds.filter(pid => pid !== id);
  state.usages = state.usages.filter(u => u.storyId !== id);
  state.openStoryId = null;
  saveState();
  render();
  showToast('Story deleted');
}

function closeStoryEditor() {
  state.editingStory = null;
  const el = document.getElementById('story-editor-overlay');
  if (el) el.remove();
}

function toggleSecondaryLP(lpId) {
  if (!state.editingStory) return;
  const idx = state.editingStory.secondaryLPs.indexOf(lpId);
  if (idx >= 0) {
    state.editingStory.secondaryLPs.splice(idx, 1);
  } else {
    state.editingStory.secondaryLPs.push(lpId);
  }
  renderStoryEditor();
}

function saveEditingStory() {
  const es = state.editingStory;
  if (!es) return;

  // Read values from form
  const get = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
  es.title = get('se-title');
  es.company = get('se-company');
  es.primaryLP = get('se-primaryLP');
  es.keywords = get('se-keywords').split('|').map(k => k.trim()).filter(Boolean);
  es.situation = get('se-situation');
  es.task = get('se-task');
  es.action = get('se-action');
  es.result = get('se-result');
  es.relevance = get('se-relevance');
  es.fullStory = get('se-fullStory');

  if (!es.title) { showToast('Title is required'); return; }
  if (!es.primaryLP) { showToast('Primary LP is required'); return; }

  // Remove primary from secondaries if present
  es.secondaryLPs = es.secondaryLPs.filter(lp => lp !== es.primaryLP);

  if (es._isNew) {
    delete es._isNew;
    es.createdAt = Date.now();
    es.updatedAt = Date.now();
    state.stories.push(es);
    showToast('Story created');
  } else {
    delete es._isNew;
    es.updatedAt = Date.now();
    const idx = state.stories.findIndex(s => s.id === es.id);
    if (idx >= 0) state.stories[idx] = es;
    showToast('Story saved');
  }

  state.editingStory = null;
  const el = document.getElementById('story-editor-overlay');
  if (el) el.remove();
  saveState();
  render();
}

function renderStoryEditor() {
  const es = state.editingStory;
  if (!es) return;

  const existing = document.getElementById('story-editor-overlay');
  if (existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'story-editor-overlay';
  overlay.className = 'se-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) closeStoryEditor(); };

  const lpOptions = LEADERSHIP_PRINCIPLES.map(lp =>
    `<option value="${lp.id}" ${es.primaryLP === lp.id ? 'selected' : ''}>${lp.short} — ${lp.name}</option>`
  ).join('');

  const secondaryChips = LEADERSHIP_PRINCIPLES.map(lp => {
    const active = es.secondaryLPs.includes(lp.id);
    return `<span class="se-lp-chip ${active ? 'active' : ''}" onclick="toggleSecondaryLP('${lp.id}')">${lp.short}</span>`;
  }).join('');

  const kw = (es.keywords || []).join('|');

  overlay.innerHTML = `
    <div class="se-panel">
      <div class="se-title">
        ${es._isNew ? '＋ New Story' : '✎ Edit Story'}
        <button class="detail-btn" onclick="closeStoryEditor()">✕</button>
      </div>

      <div class="se-row">
        <div>
          <div class="se-label">Title *</div>
          <input class="se-input" id="se-title" value="${escapeAttr(es.title)}" placeholder="Story title" />
        </div>
        <div style="max-width:200px">
          <div class="se-label">Company</div>
          <input class="se-input" id="se-company" value="${escapeAttr(es.company)}" placeholder="Company" />
        </div>
      </div>

      <div>
        <div class="se-label">Primary Leadership Principle *</div>
        <select class="se-select" id="se-primaryLP">${lpOptions}</select>
      </div>

      <div>
        <div class="se-label">Secondary LPs (click to toggle)</div>
        <div class="se-lp-grid">${secondaryChips}</div>
      </div>

      <div>
        <div class="se-label">Keywords (pipe-separated)</div>
        <input class="se-input" id="se-keywords" value="${escapeAttr(kw)}" placeholder="keyword1|keyword2|keyword3" />
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:#3b82f6">S</span> Situation</div>
        <textarea class="se-textarea" id="se-situation" placeholder="Describe the context...">${escapeHtml(es.situation || '')}</textarea>
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:#a855f7">T</span> Task</div>
        <textarea class="se-textarea" id="se-task" placeholder="What was your responsibility?">${escapeHtml(es.task || '')}</textarea>
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:#f97316">A</span> Action</div>
        <textarea class="se-textarea" id="se-action" style="min-height:140px" placeholder="What did you do?">${escapeHtml(es.action || '')}</textarea>
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:#22c55e">R</span> Result</div>
        <textarea class="se-textarea" id="se-result" placeholder="What was the outcome?">${escapeHtml(es.result || '')}</textarea>
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:var(--accent)">R</span> Relevance</div>
        <textarea class="se-textarea" id="se-relevance" placeholder="Why does this matter for the role?">${escapeHtml(es.relevance || '')}</textarea>
      </div>

      <div>
        <div class="se-starr-label"><span class="letter" style="background:var(--blue)">📖</span> Full Story (optional)</div>
        <textarea class="se-textarea" id="se-fullStory" style="min-height:120px" placeholder="Extended narrative version...">${escapeHtml(es.fullStory || '')}</textarea>
      </div>

      <div class="se-actions">
        ${!es._isNew ? `<button class="btn btn-danger" style="margin-right:auto" onclick="if(confirm('Delete this story?')){closeStoryEditor();deleteStory('${es.id}')}">🗑 Delete</button>` : ''}
        <button class="btn" onclick="closeStoryEditor()">Cancel</button>
        <button class="btn btn-primary" onclick="saveEditingStory()">💾 ${es._isNew ? 'Create Story' : 'Save Changes'}</button>
      </div>
    </div>
  `;

  document.body.appendChild(overlay);

  // ESC to close
  const escHandler = (e) => {
    if (e.key === 'Escape') { closeStoryEditor(); document.removeEventListener('keydown', escHandler); }
  };
  document.addEventListener('keydown', escHandler);

  // Focus title for new stories
  if (es._isNew) {
    setTimeout(() => { const el = document.getElementById('se-title'); if (el) el.focus(); }, 100);
  }
}

function printStories() {
  if (state.stories.length === 0) { showToast('No stories to print'); return; }

  // Sort by LP order (matching LEADERSHIP_PRINCIPLES array), then by title
  const lpOrder = {};
  LEADERSHIP_PRINCIPLES.forEach((lp, i) => { lpOrder[lp.id] = i; });
  const sorted = [...state.stories].sort((a, b) => {
    const aIdx = lpOrder[a.primaryLP] ?? 999;
    const bIdx = lpOrder[b.primaryLP] ?? 999;
    if (aIdx !== bIdx) return aIdx - bIdx;
    return (a.title || '').localeCompare(b.title || '');
  });

  const truncate = (text, max) => {
    if (!text) return '';
    const clean = text.replace(/\n+/g, ' ').trim();

function printMatrix() {
  if (state.stories.length === 0) { showToast('No stories to print'); return; }

  const lpOrder = {};
  LEADERSHIP_PRINCIPLES.forEach((lp, i) => { lpOrder[lp.id] = i; });
  const sorted = [...state.stories].sort((a, b) => {
    const aIdx = lpOrder[a.primaryLP] ?? 999;
    const bIdx = lpOrder[b.primaryLP] ?? 999;
    if (aIdx !== bIdx) return aIdx - bIdx;
    return (a.title || '').localeCompare(b.title || '');
  });

  const abbrev = (text, max) => {
    if (!text) return '—';
    // Extract key phrases: split on sentences/bullets, take first meaningful chunks
    const parts = text.replace(/\n+/g, ' ').split(/(?<=[.!?])\s+|(?:\n)/).map(s => s.trim()).filter(s => s.length > 8);
    const keywords = [];
    for (const p of parts) {
      // Extract the core phrase — strip filler words, keep substance
      const core = p.replace(/^(I |My |We |The |Our |This |That |In |At |On |By |As a |After |Before |During |When |While )/i, '').trim();
      if (core.length > 3 && keywords.length < 3) {
        const short = core.length > max ? core.slice(0, max) + '…' : core;
        keywords.push(short);
      }
    }
    return keywords.length > 0 ? keywords.join(' · ') : text.slice(0, max * 3) + '…';
  };

  // Group by LP
  let currentLP = null;
  const rows = sorted.map(s => {
    const color = LP_COLORS[s.primaryLP] || '#888';
    const showLP = s.primaryLP !== currentLP;
    currentLP = s.primaryLP;
    const lpHeader = showLP ? `
      <tr class="lp-divider">
        <td colspan="6" style="background:${color};color:#fff;font-weight:800;font-size:8px;padding:3px 6px;letter-spacing:0.5px;text-transform:uppercase">
          ${lpShort(s.primaryLP)} — ${lpName(s.primaryLP)}
        </td>
      </tr>` : '';

    return `${lpHeader}
      <tr>
        <td class="m-lp" style="background:${color}">${lpShort(s.primaryLP)}</td>
        <td class="m-title">${s.title}${s.company ? `<span class="m-co">${s.company}</span>` : ''}</td>
        <td class="m-cell m-s">${abbrev(s.situation, 40)}</td>
        <td class="m-cell m-t">${abbrev(s.task, 35)}</td>
        <td class="m-cell m-a">${abbrev(s.action, 45)}</td>
        <td class="m-cell m-r">${abbrev(s.result, 40)}</td>
      </tr>`;
  }).join('');

  const printWindow = window.open('', '_blank');
  printWindow.document.write(`<!DOCTYPE html>
<html>

<style>

function extractBullets(text, count) {
  if (!text) return [];
  // Split on sentence boundaries, numbered lists, bullet chars, or newlines
  const raw = text
    .replace(/\n{2,}/g, '\n')
    .split(/(?:\n(?:\d+[\).]?\s*|-\s*|•\s*)?)|(?<=[.!?])\s+/)
    .map(s => s.replace(/^\d+[\).]\s*/, '').replace(/^[-•]\s*/, '').trim())
    .filter(s => s.length > 15);

  if (raw.length <= count) return raw.slice(0, count);

  // Pick first, middle, and last meaningful sentences for spread
  const result = [];
  result.push(raw[0]);
  if (raw.length >= 3) {
    result.push(raw[Math.floor(raw.length / 2)]);
  }
  result.push(raw[raw.length - 1]);
  return result.slice(0, count);
}

function attachKeyboardListener() {
document.addEventListener('keydown', (e) => {
  // Don't capture when typing in inputs/textareas
  const tag = e.target.tagName.toLowerCase();
  const isInput = tag === 'input' || tag === 'textarea';

  if (e.key === '/' && !isInput && !state.openStoryId && !state.activeModal) {
    e.preventDefault();
    const input = document.getElementById('searchInput');
    if (input) input.focus();
    return;
  }

  if (e.key === 'Escape') {
    if (state.openStoryId) { closeStory(); return; }
    if (state.activeModal) { closeModal(); return; }
    if (isInput) { e.target.blur(); return; }
  }

  if (e.key === 'u' || e.key === 'U') {
    if (!isInput && state.openStoryId) {
      e.preventDefault();
      toggleUsed(state.openStoryId);
      return;
    }
  }

  if (e.key === 'f' || e.key === 'F') {
    if (!isInput && state.openStoryId) {
      const s = state.stories.find(st => st.id === state.openStoryId);
      if (s && s.fullStory) {
        e.preventDefault();
        toggleFullStory();
        return;
      }
    }
  }

  // Arrow nav in grid
  if (!state.openStoryId && !state.activeModal && !isInput) {
    const filtered = searchStories(state.searchQuery, state.selectedLP);
    if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
      e.preventDefault();
      state.navIndex = Math.min(state.navIndex + 1, filtered.length - 1);
      render();
      return;
    }
    if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
      e.preventDefault();
      state.navIndex = Math.max(state.navIndex - 1, -1);
      render();
      return;
    }
    if (e.key === 'Enter' && state.navIndex >= 0 && state.navIndex < filtered.length) {
      e.preventDefault();
      openStory(filtered[state.navIndex].id);
      return;
    }
  }

  // Enter in search
  if (isInput && e.target.id === 'searchInput' && e.key === 'Enter') {
    const filtered = searchStories(state.searchQuery, state.selectedLP);
    if (filtered.length > 0) {
      openStory(filtered[0].id);
    }
  }
});
}

(async function() {
  if (!supa) {
    // Supabase failed to load — fall back to local-only mode
    console.warn('Running in local-only mode (no Supabase)');
    document.body.innerHTML = '<div id="app" class="app"></div>';
    loadState();
    attachKeyboardListener();
    render();
    return;
  }

  // Listen for auth state changes
  supa.auth.onAuthStateChange(async (event, session) => {
    if (session && session.user) {
      currentUser = session.user;
      await initApp();
    } else {
      currentUser = null;
      appInitialized = false;
      renderAuthScreen();
    }
  });

  // Check initial session
  const { data: { session } } = await supa.auth.getSession();
  if (session && session.user) {
    currentUser = session.user;
    await initApp();
  } else {
    renderAuthScreen();
  }
})();
</script>
